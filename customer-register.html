<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Ola's Cutz - Create Account</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #1a1a1a 0%, #2d2d2d 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .container {
            background: white;
            padding: 50px;
            border-radius: 20px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            width: 90%;
            max-width: 450px;
            animation: slideUp 0.6s ease;
        }

        @keyframes slideUp {
            from {
                opacity: 0;
                transform: translateY(50px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .header {
            text-align: center;
            margin-bottom: 40px;
        }

        .header i {
            font-size: 4rem;
            color: #D4AF37;
            margin-bottom: 15px;
        }

        .header h1 {
            font-size: 2rem;
            color: #1a1a1a;
            margin-bottom: 10px;
        }

        .header p {
            color: #666;
            font-size: 0.9rem;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 8px;
            font-weight: 600;
            color: #1a1a1a;
        }

        .form-group input {
            width: 100%;
            padding: 12px 15px;
            border: 2px solid #ddd;
            border-radius: 10px;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            border-color: #D4AF37;
            box-shadow: 0 0 0 3px rgba(212, 175, 55, 0.1);
        }

        .password-requirements {
            background: #f0f0f0;
            padding: 12px;
            border-radius: 8px;
            margin-top: 10px;
            font-size: 0.85rem;
            color: #666;
            line-height: 1.6;
        }

        .password-requirements li {
            margin-left: 20px;
        }

        .register-btn {
            width: 100%;
            padding: 15px;
            background: #D4AF37;
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.3s ease;
            margin-top: 10px;
        }

        .register-btn:hover {
            background: #B8941E;
            transform: translateY(-2px);
            box-shadow: 0 10px 25px rgba(212, 175, 55, 0.3);
        }

        .register-btn:active {
            transform: translateY(0);
        }

        .error-message {
            background: #fee;
            color: #c33;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            border-left: 4px solid #c33;
        }

        .error-message.show {
            display: block;
        }

        .success-message {
            background: #efe;
            color: #3c3;
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            display: none;
            text-align: center;
            border-left: 4px solid #3c3;
        }

        .success-message.show {
            display: block;
        }

        .footer-links {
            text-align: center;
            margin-top: 20px;
            padding-top: 20px;
            border-top: 1px solid #ddd;
        }

        .footer-links a {
            color: #D4AF37;
            text-decoration: none;
            font-weight: 600;
            margin: 0 5px;
            transition: all 0.3s ease;
        }

        .footer-links a:hover {
            color: #B8941E;
        }

        .divider {
            text-align: center;
            color: #999;
            margin: 20px 0;
        }

        @media (max-width: 480px) {
            .container {
                padding: 30px 20px;
            }

            .header h1 {
                font-size: 1.5rem;
            }

            .header i {
                font-size: 3rem;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <i class="fas fa-cut"></i>
            <h1>Ola's Cutz</h1>
            <p>Create Your Account</p>
        </div>

        <div class="error-message" id="errorMessage"></div>
        <div class="success-message" id="successMessage"></div>

        <form onsubmit="handleRegister(event)">
            <div class="form-group">
                <label for="fullName">
                    <i class="fas fa-user"></i> Full Name
                </label>
                <input type="text" id="fullName" placeholder="Enter your full name" required>
            </div>

            <div class="form-group">
                <label for="email">
                    <i class="fas fa-envelope"></i> Email Address
                </label>
                <input type="email" id="email" placeholder="Enter your email" required>
            </div>

            <div class="form-group">
                <label for="phone">
                    <i class="fas fa-phone"></i> Phone Number
                </label>
                <input type="tel" id="phone" placeholder="08012345678" required>
            </div>

            <div class="form-group">
                <label for="username">
                    <i class="fas fa-user-tag"></i> Username
                </label>
                <input type="text" id="username" placeholder="Choose a username (min 4 characters)" required>
            </div>

            <div class="form-group">
                <label for="password">
                    <i class="fas fa-lock"></i> Password
                </label>
                <input type="password" id="password" placeholder="Create a strong password" required>
                <div class="password-requirements">
                    <strong>Password must have:</strong>
                    <ul>
                        <li>At least 6 characters</li>
                        <li>One number (0-9)</li>
                        <li>One uppercase letter (A-Z)</li>
                    </ul>
                </div>
            </div>

            <div class="form-group">
                <label for="confirmPassword">
                    <i class="fas fa-lock"></i> Confirm Password
                </label>
                <input type="password" id="confirmPassword" placeholder="Confirm your password" required>
            </div>

            <button type="submit" class="register-btn">
                <i class="fas fa-user-plus"></i> Create Account
            </button>
        </form>

        <div class="divider">
            Already have an account?
        </div>

        <div class="footer-links">
            <a href="customer-login.html">
                <i class="fas fa-sign-in-alt"></i> Login Here
            </a>
            <span style="color: #ddd;">|</span>
            <a href="index.html">
                <i class="fas fa-home"></i> Back to Home
            </a>
        </div>
    </div>

    <script>
        function handleRegister(event) {
            event.preventDefault();

            const fullName = document.getElementById('fullName').value.trim();
            const email = document.getElementById('email').value.trim();
            const phone = document.getElementById('phone').value.trim();
            const username = document.getElementById('username').value.trim();
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            const errorDiv = document.getElementById('errorMessage');
            const successDiv = document.getElementById('successMessage');

            // Reset messages
            errorDiv.classList.remove('show');
            successDiv.classList.remove('show');

            // Validation
            if (!fullName) {
                showError('Please enter your full name');
                return;
            }

            if (!email) {
                showError('Please enter your email');
                return;
            }

            if (!phone) {
                showError('Please enter your phone number');
                return;
            }

            if (username.length < 4) {
                showError('Username must be at least 4 characters');
                return;
            }

            // Password validation
            if (password.length < 6) {
                showError('Password must be at least 6 characters');
                return;
            }

            if (!/[0-9]/.test(password)) {
                showError('Password must contain at least one number');
                return;
            }

            if (!/[A-Z]/.test(password)) {
                showError('Password must contain at least one uppercase letter');
                return;
            }

            if (password !== confirmPassword) {
                showError('Passwords do not match');
                return;
            }

            // Check if username already exists
            const customers = JSON.parse(localStorage.getItem('customers')) || [];
            if (customers.some(c => c.username === username)) {
                showError('Username already taken. Please choose another.');
                return;
            }

            // Create customer account
            const newCustomer = {
                id: 'CUST' + Date.now(),
                fullName: fullName,
                email: email,
                phone: phone,
                username: username,
                password: password, // In production, hash this!
                createdAt: new Date().toISOString()
            };

            customers.push(newCustomer);
            localStorage.setItem('customers', JSON.stringify(customers));

            // Show success
            successDiv.textContent = 'Account created successfully! Redirecting to login...';
            successDiv.classList.add('show');

            // Redirect after 2 seconds
            setTimeout(() => {
                localStorage.setItem('registerSuccess', 'true');
                window.location.href = 'customer-login.html';
            }, 2000);
        }

        function showError(message) {
            const errorDiv = document.getElementById('errorMessage');
            errorDiv.textContent = message;
            errorDiv.classList.add('show');

            setTimeout(() => {
                errorDiv.classList.remove('show');
            }, 4000);
        }
    </script>
</body>
</html>
